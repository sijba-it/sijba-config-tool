<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>sijba config</title>
<style>
  :root {
    --bg: #1a1d23;
    --panel: #242830;
    --border: #3a4050;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --accent: #6db3f2;
    --ok: #7dcea0;
    --bad: #e07a7a;
    --mono: "JetBrains Mono", "Fira Code", ui-monospace, monospace;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--sans);
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: baseline; gap: 1rem;
    padding: .75rem 1.25rem; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 1.1rem; margin: 0; letter-spacing: .02em; }
  header .hint { color: var(--muted); font-size: .85rem; }
  #auth-bar { display: flex; gap: .5rem; align-items: center; margin-left: auto; }
  #auth-bar input, .field input, .field select, .field textarea, .kv input, .route-row input {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: .35rem .55rem; border-radius: 4px; font: inherit;
  }
  #auth-bar input { width: 14rem; font-family: var(--mono); font-size: .8rem; }
  main { display: grid; grid-template-columns: 16rem 1fr; flex: 1; min-height: 0; }
  #files {
    border-right: 1px solid var(--border); overflow: auto; padding: .5rem 0;
    background: var(--panel);
  }
  #files button {
    display: block; width: 100%; text-align: left; border: 0; background: transparent;
    color: var(--text); padding: .4rem 1rem; font: inherit; cursor: pointer;
    font-family: var(--mono); font-size: .8rem;
  }
  #files button:hover { background: #2c313c; }
  #files button.active { background: #343b4a; color: var(--accent); }
  #files .kind { color: var(--muted); font-size: .7rem; margin-right: .35rem; }
  #editor-wrap { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #toolbar {
    display: flex; gap: .5rem; align-items: center; flex-wrap: wrap;
    padding: .5rem 1rem; border-bottom: 1px solid var(--border);
  }
  #toolbar .path { font-family: var(--mono); font-size: .85rem; color: var(--accent); }
  #toolbar .spacer { flex: 1; }
  .tabs { display: flex; gap: .25rem; }
  .tabs button {
    background: transparent; border: 1px solid transparent; color: var(--muted);
    padding: .3rem .7rem; border-radius: 4px; cursor: pointer; font: inherit;
  }
  .tabs button.active {
    color: var(--text); border-color: var(--border); background: #2c313c;
  }
  button.act {
    background: #3a4558; color: var(--text); border: 1px solid var(--border);
    padding: .35rem .75rem; border-radius: 4px; cursor: pointer; font: inherit;
  }
  button.act.primary { background: #2a5a8a; border-color: #3a7ab0; }
  button.act.small { padding: .2rem .5rem; font-size: .8rem; }
  button.act:disabled { opacity: .5; cursor: default; }
  #status { font-size: .85rem; color: var(--muted); max-width: 28rem; }
  #status.ok { color: var(--ok); }
  #status.bad { color: var(--bad); }
  #pane-raw, #pane-form { flex: 1; min-height: 0; display: none; }
  #pane-raw.active, #pane-form.active { display: flex; flex-direction: column; }
  #editor {
    flex: 1; width: 100%; border: 0; resize: none; padding: 1rem;
    background: var(--bg); color: var(--text);
    font-family: var(--mono); font-size: .85rem; line-height: 1.45; tab-size: 2;
  }
  #editor:focus { outline: none; }
  #form {
    flex: 1; overflow: auto; padding: 1rem 1.25rem 2rem;
  }
  #form.disabled { opacity: .55; pointer-events: none; }
  .section {
    margin-bottom: 1.25rem; padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .section h2 {
    margin: 0 0 .75rem; font-size: .75rem; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); font-weight: 600;
  }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr));
    gap: .75rem 1rem;
  }
  .field { display: flex; flex-direction: column; gap: .25rem; }
  .field.wide { grid-column: 1 / -1; }
  .field label { font-size: .75rem; color: var(--muted); }
  .field input, .field select, .field textarea { width: 100%; }
  .field textarea { min-height: 4.5rem; font-family: var(--mono); font-size: .8rem; }
  .field.checks { flex-direction: row; flex-wrap: wrap; gap: .75rem 1.25rem; align-items: center; padding-top: 1.1rem; }
  .field.checks label { display: flex; gap: .35rem; align-items: center; color: var(--text); font-size: .85rem; }
  .kv, .route-list { display: flex; flex-direction: column; gap: .4rem; }
  .kv-row, .route-row {
    display: grid; gap: .4rem; align-items: center;
  }
  .kv-row { grid-template-columns: 1fr 1fr auto; }
  .route-row { grid-template-columns: 1fr 1.2fr auto; }
  .empty { color: var(--muted); font-size: .85rem; }
  details.advanced { margin-top: .5rem; }
  details.advanced > summary {
    cursor: pointer; color: var(--muted); font-size: .8rem; margin-bottom: .5rem;
  }
  #view-tabs { display: none; margin-left: .5rem; }
  #view-tabs.on { display: flex; }
  #connectors-view { display: none; flex: 1; overflow: auto; padding: 1rem 1.25rem 2rem; }
  #connectors-view.on { display: block; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(22rem, 1fr)); gap: 1rem; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 1rem; }
  .card h3 { margin: 0 0 .25rem; font-size: 1rem; display: flex; gap: .5rem; align-items: center; }
  .card .desc { color: var(--muted); font-size: .85rem; margin: 0 0 .75rem; }
  .badge { font-size: .7rem; padding: .1rem .45rem; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .badge.running { color: var(--ok); border-color: var(--ok); }
  .badge.starting { color: var(--accent); border-color: var(--accent); }
  .card .detail { font-size: .8rem; color: var(--muted); margin: .5rem 0 0; }
  .card .detail.bad { color: var(--bad); }
  .card .fields { display: flex; flex-direction: column; gap: .6rem; margin-bottom: .75rem; }
  .card .actions { display: flex; gap: .5rem; align-items: center; }
  .card .msg { font-size: .8rem; color: var(--muted); }
  .card .msg.ok { color: var(--ok); }
  .card .msg.bad { color: var(--bad); }
  .field .help { color: var(--muted); font-size: .7rem; }
  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; grid-template-rows: 10rem 1fr; }
    #files { border-right: 0; border-bottom: 1px solid var(--border); }
    .kv-row, .route-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>sijba config</h1>
  <span class="hint">filesystem · restart core to apply</span>
  <div class="tabs" id="view-tabs">
    <button type="button" id="view-files" class="active">Files</button>
    <button type="button" id="view-connectors-btn">Connectors</button>
  </div>
  <div id="auth-bar">
    <input id="token" type="password" placeholder="Bearer token" autocomplete="off"/>
  </div>
</header>
<main>
  <nav id="files"></nav>
  <section id="editor-wrap">
    <div id="toolbar">
      <span class="path" id="cur-path">—</span>
      <div class="tabs">
        <button type="button" id="tab-form" class="active">Form</button>
        <button type="button" id="tab-raw">Raw</button>
      </div>
      <span class="spacer"></span>
      <span id="status"></span>
      <button class="act" id="btn-validate" disabled>Validate</button>
      <button class="act primary" id="btn-save" disabled>Save</button>
    </div>
    <div id="pane-form" class="active"><div id="form"><p class="empty">Select a file…</p></div></div>
    <div id="pane-raw"><textarea id="editor" spellcheck="false" disabled placeholder="Select a file…"></textarea></div>
  </section>
</main>
<section id="connectors-view"><div class="cards" id="cards"></div></section>
<script>
const base = "__BASE_PATH__";

let current = null;
let kind = null;          // core | handler | route
let mode = "form";        // form | raw
let model = null;         // parsed object/array
let parseError = null;
let knownKeys = new Set(); // keys the form owns (for merge)

let token = localStorage.getItem("sijba_config_token") || "";
const $token = document.getElementById("token");
$token.value = token;
$token.addEventListener("change", () => {
  token = $token.value.trim();
  localStorage.setItem("sijba_config_token", token);
  loadList();
});

function headers() {
  const h = {"Content-Type": "application/json"};
  if (token) h["Authorization"] = "Bearer " + token;
  return h;
}

function setStatus(msg, cls) {
  const el = document.getElementById("status");
  el.textContent = msg || "";
  el.className = cls || "";
}

async function api(path, opts) {
  const r = await fetch(base + path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    const detail = data.error || data.detail;
    throw new Error(typeof detail === "string" ? detail : (r.statusText || "request failed"));
  }
  return data;
}

function detectKind(path) {
  if (path === "core.yaml") return "core";
  if (path.startsWith("handlers/")) return "handler";
  if (path.startsWith("routes/")) return "route";
  return null;
}

async function setMode(next) {
  if (mode === "form" && next === "raw") {
    try {
      syncFormToModel();
      await syncModelToRaw();
      parseError = null;
    } catch (e) {
      setStatus(String(e.message || e), "bad");
      return;
    }
  }
  if (mode === "raw" && next === "form") {
    try {
      await syncRawToModel();
      parseError = null;
      renderForm();
    } catch (e) {
      parseError = String(e.message || e);
      setStatus("Raw invalid — fix in Raw tab: " + parseError, "bad");
      next = "raw";
    }
  }
  mode = next;
  document.getElementById("tab-form").classList.toggle("active", mode === "form");
  document.getElementById("tab-raw").classList.toggle("active", mode === "raw");
  document.getElementById("pane-form").classList.toggle("active", mode === "form");
  document.getElementById("pane-raw").classList.toggle("active", mode === "raw");
  document.getElementById("form").classList.toggle("disabled", !!parseError && mode === "form");
}

document.getElementById("tab-form").onclick = () => { setMode("form"); };
document.getElementById("tab-raw").onclick = () => { setMode("raw"); };

async function loadList() {
  const nav = document.getElementById("files");
  nav.innerHTML = "";
  try {
    const data = await api("/api/files", {headers: headers()});
    for (const f of data.files) {
      const b = document.createElement("button");
      b.innerHTML = '<span class="kind">' + f.kind + "</span>" + f.path;
      if (f.path === current) b.classList.add("active");
      b.onclick = () => openFile(f.path);
      nav.appendChild(b);
    }
  } catch (e) {
    setStatus(String(e.message || e), "bad");
  }
}

async function openFile(path) {
  current = path;
  kind = detectKind(path);
  document.getElementById("cur-path").textContent = path;
  document.querySelectorAll("#files button").forEach(b => {
    b.classList.toggle("active", b.textContent.includes(path));
  });
  try {
    const data = await api("/api/files/" + encodeURI(path), {headers: headers()});
    const ed = document.getElementById("editor");
    ed.value = data.content;
    ed.disabled = false;
    document.getElementById("btn-save").disabled = false;
    document.getElementById("btn-validate").disabled = false;
    parseError = null;
    try {
      const parsed = await api("/api/parse/" + encodeURI(path), {
        method: "POST", headers: headers(),
        body: JSON.stringify({content: data.content}),
      });
      model = parsed.data;
      kind = parsed.kind;
      renderForm();
      mode = "raw";
      await setMode("form");
      setStatus("loaded", "ok");
    } catch (e) {
      model = null;
      document.getElementById("form").innerHTML =
        '<p class="empty">Parse failed — use Raw to repair.<br><code>' +
        esc(String(e.message || e)) + "</code></p>";
      mode = "form";
      await setMode("raw");
      setStatus("loaded (raw only): " + (e.message || e), "bad");
    }
    loadList();
  } catch (e) {
    setStatus(String(e.message || e), "bad");
  }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === "className") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "checked") n.checked = !!v;
    else if (k === "value") n.value = v == null ? "" : v;
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v !== undefined && v !== null) n.setAttribute(k, v);
  }
  for (const c of kids) {
    if (c == null) continue;
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return n;
}

function field(label, input) {
  return el("div", {className: "field"}, el("label", {text: label}), input);
}

function textInput(value, attrs) {
  return el("input", Object.assign({type: "text", value: value == null ? "" : String(value)}, attrs || {}));
}

function numInput(value, attrs) {
  const v = value == null || value === "" ? "" : String(value);
  return el("input", Object.assign({type: "number", value: v, step: "any"}, attrs || {}));
}

function selectInput(value, options) {
  const s = el("select", {});
  for (const opt of options) {
    const o = el("option", {value: opt, text: opt});
    if (opt === value) o.selected = true;
    s.appendChild(o);
  }
  return s;
}

function check(label, checked) {
  const id = "chk-" + label.replace(/\W+/g, "-");
  return el("label", {},
    el("input", {type: "checkbox", id, checked: !!checked}),
    " " + label
  );
}

function renderForm() {
  const root = document.getElementById("form");
  root.innerHTML = "";
  knownKeys = new Set();
  if (!current || model == null) {
    root.innerHTML = '<p class="empty">Select a file…</p>';
    return;
  }
  if (kind === "handler") root.appendChild(renderHandlerForm(model));
  else if (kind === "route") root.appendChild(renderRoutesForm(model));
  else if (kind === "core") root.appendChild(renderCoreForm(model));
  else root.innerHTML = '<p class="empty">No form for this file — use Raw.</p>';
}

/* ---------- Handler ---------- */

const HANDLER_BOOLS = [
  "required", "await_response", "allow_direct_inject",
  "continue_on_match", "receive_handler_context",
];

function renderHandlerForm(data) {
  const wrap = el("div", {});
  const mark = (...keys) => keys.forEach(k => knownKeys.add(k));

  mark("id", "priority", "direction", "type", "lifecycle", "exec", "timeout_seconds",
       "router_hint", "match", "env", "category", "args", "shared_process",
       "context", "startup", ...HANDLER_BOOLS);

  const basics = el("div", {className: "section"}, el("h2", {text: "Basics"}));
  const grid = el("div", {className: "grid"});
  const id = textInput(data.id, {id: "h-id"});
  const priority = numInput(data.priority, {id: "h-priority"});
  const direction = selectInput(data.direction || "inbound", ["inbound", "outbound", "source"]);
  direction.id = "h-direction";
  const type = selectInput(data.type || "exec_json", ["exec_json", "http"]);
  type.id = "h-type";
  const lifecycle = selectInput(data.lifecycle || "per_message", ["per_message", "persistent"]);
  lifecycle.id = "h-lifecycle";
  const exec = textInput(data.exec, {id: "h-exec"});
  const timeout = numInput(data.timeout_seconds, {id: "h-timeout"});
  grid.append(
    field("id", id),
    field("priority", priority),
    field("direction", direction),
    field("type", type),
    field("lifecycle", lifecycle),
    field("timeout_seconds", timeout),
    el("div", {className: "field wide"}, el("label", {text: "exec"}), exec),
  );
  basics.appendChild(grid);
  wrap.appendChild(basics);

  const match = data.match || {};
  const matchSec = el("div", {className: "section"}, el("h2", {text: "Match"}));
  const mgrid = el("div", {className: "grid"});
  const regex = textInput(match.regex, {id: "h-regex"});
  const sources = textInput((match.source || []).join(", "), {id: "h-sources", placeholder: "telegram, webhook:voice"});
  mgrid.append(
    el("div", {className: "field wide"}, el("label", {text: "regex"}), regex),
    el("div", {className: "field wide"}, el("label", {text: "source (comma-separated)"}), sources),
  );
  matchSec.appendChild(mgrid);
  wrap.appendChild(matchSec);

  const flags = el("div", {className: "section"}, el("h2", {text: "Flags"}));
  const checks = el("div", {className: "field checks"});
  for (const b of HANDLER_BOOLS) {
    checks.appendChild(check(b, !!data[b]));
  }
  flags.appendChild(checks);
  wrap.appendChild(flags);

  const hintSec = el("div", {className: "section"}, el("h2", {text: "Router"}));
  const hint = el("textarea", {id: "h-hint"});
  hint.value = data.router_hint || "";
  hintSec.appendChild(field("router_hint", hint));
  wrap.appendChild(hintSec);

  const envSec = el("div", {className: "section"}, el("h2", {text: "env"}));
  const envBox = el("div", {className: "kv", id: "h-env"});
  const env = data.env && typeof data.env === "object" ? data.env : {};
  const envEntries = Object.entries(env);
  if (!envEntries.length) envBox.appendChild(el("p", {className: "empty", text: "No env vars"}));
  for (const [k, v] of envEntries) envBox.appendChild(kvRow(k, v));
  envSec.append(
    envBox,
    el("button", {type: "button", className: "act small", text: "+ env", onClick: () => {
      if (envBox.querySelector(".empty")) envBox.innerHTML = "";
      envBox.appendChild(kvRow("", ""));
    }}),
  );
  wrap.appendChild(envSec);

  const adv = el("details", {className: "advanced section"});
  adv.appendChild(el("summary", {text: "Advanced (category, context, startup, …)"}));
  const ag = el("div", {className: "grid"});
  const category = textInput((data.category || []).join(", "), {id: "h-category"});
  const args = textInput((data.args || []).join(", "), {id: "h-args"});
  const shared = textInput(data.shared_process, {id: "h-shared"});
  const ctx = data.context || {};
  const ctxNs = textInput(ctx.namespace, {id: "h-ctx-ns"});
  const ctxKey = textInput(ctx.key, {id: "h-ctx-key"});
  const st = data.startup || {};
  const stUrl = textInput(st.url, {id: "h-st-url"});
  const stPath = textInput(st.invoke_path, {id: "h-st-path"});
  const stPol = selectInput(st.restart_policy || "", ["", "always", "on_failure", "never"]);
  stPol.id = "h-st-pol";
  ag.append(
    el("div", {className: "field wide"}, el("label", {text: "category (comma-separated)"}), category),
    el("div", {className: "field wide"}, el("label", {text: "args (comma-separated)"}), args),
    field("shared_process", shared),
    field("context.namespace", ctxNs),
    field("context.key", ctxKey),
    field("startup.url", stUrl),
    field("startup.invoke_path", stPath),
    field("startup.restart_policy", stPol),
  );
  adv.appendChild(ag);
  wrap.appendChild(adv);

  return wrap;
}

function kvRow(k, v) {
  const row = el("div", {className: "kv-row"});
  row.append(
    textInput(k, {placeholder: "KEY"}),
    textInput(v, {placeholder: "value"}),
    el("button", {type: "button", className: "act small", text: "×", onClick: () => row.remove()}),
  );
  return row;
}

function readKv(box) {
  const out = {};
  box.querySelectorAll(".kv-row").forEach(row => {
    const inputs = row.querySelectorAll("input");
    const k = inputs[0].value.trim();
    if (!k) return;
    out[k] = inputs[1].value;
  });
  return out;
}

function splitList(s) {
  return String(s || "").split(",").map(x => x.trim()).filter(Boolean);
}

function syncHandlerFormToModel() {
  const next = Object.assign({}, model);
  // drop known keys then re-apply from form (preserve unknown)
  for (const k of knownKeys) delete next[k];

  next.id = document.getElementById("h-id").value.trim();
  const pr = document.getElementById("h-priority").value;
  if (pr !== "") next.priority = Number(pr);
  next.direction = document.getElementById("h-direction").value;
  next.type = document.getElementById("h-type").value;
  next.lifecycle = document.getElementById("h-lifecycle").value;
  const exec = document.getElementById("h-exec").value.trim();
  if (exec) next.exec = exec;
  const to = document.getElementById("h-timeout").value;
  if (to !== "") next.timeout_seconds = Number(to);

  const regex = document.getElementById("h-regex").value;
  const sources = splitList(document.getElementById("h-sources").value);
  if (regex || sources.length) {
    next.match = {};
    if (regex) next.match.regex = regex;
    if (sources.length) next.match.source = sources;
  }

  for (const b of HANDLER_BOOLS) {
    const box = document.getElementById("chk-" + b.replace(/\W+/g, "-"));
    if (box) next[b] = box.checked;
  }

  const hint = document.getElementById("h-hint").value;
  if (hint.trim()) next.router_hint = hint;

  const env = readKv(document.getElementById("h-env"));
  if (Object.keys(env).length) next.env = env;

  const cat = splitList(document.getElementById("h-category").value);
  if (cat.length) next.category = cat;
  const args = splitList(document.getElementById("h-args").value);
  if (args.length) next.args = args;
  const shared = document.getElementById("h-shared").value.trim();
  if (shared) next.shared_process = shared;

  const ns = document.getElementById("h-ctx-ns").value.trim();
  const key = document.getElementById("h-ctx-key").value.trim();
  if (ns || key) {
    next.context = {};
    if (ns) next.context.namespace = ns;
    if (key) next.context.key = key;
  }

  const url = document.getElementById("h-st-url").value.trim();
  const path = document.getElementById("h-st-path").value.trim();
  const pol = document.getElementById("h-st-pol").value;
  if (url || path || pol) {
    next.startup = {};
    if (url) next.startup.url = url;
    if (path) next.startup.invoke_path = path;
    if (pol) next.startup.restart_policy = pol;
  }

  model = next;
}

/* ---------- Routes ---------- */

function renderRoutesForm(data) {
  knownKeys = new Set(); // whole array is owned
  const wrap = el("div", {});
  const sec = el("div", {className: "section"}, el("h2", {text: "Routes"}));
  const list = el("div", {className: "route-list", id: "r-list"});
  const rows = Array.isArray(data) ? data : [];
  if (!rows.length) list.appendChild(el("p", {className: "empty", text: "No routes"}));
  for (const r of rows) list.appendChild(routeRow(r.pattern || "", r.inject || ""));
  sec.append(
    list,
    el("button", {type: "button", className: "act small", text: "+ route", onClick: () => {
      if (list.querySelector(".empty")) list.innerHTML = "";
      list.appendChild(routeRow("", ""));
    }}),
  );
  wrap.appendChild(sec);
  return wrap;
}

function routeRow(pattern, inject) {
  const row = el("div", {className: "route-row"});
  row.append(
    textInput(pattern, {placeholder: "pattern (regex)"}),
    textInput(inject, {placeholder: "inject template"}),
    el("button", {type: "button", className: "act small", text: "×", onClick: () => row.remove()}),
  );
  return row;
}

function syncRoutesFormToModel() {
  const list = document.getElementById("r-list");
  const out = [];
  list.querySelectorAll(".route-row").forEach(row => {
    const inputs = row.querySelectorAll("input");
    const pattern = inputs[0].value;
    const inject = inputs[1].value;
    if (!pattern && !inject) return;
    out.push({pattern, inject});
  });
  model = out;
}

/* ---------- Core ---------- */

function renderCoreForm(data) {
  knownKeys = new Set([
    "port", "log_level", "db_path", "max_inject_depth", "log_buffer_size",
    "auth_token", "webhook_token", "upload_dir", "runtime", "webhooks",
  ]);
  const wrap = el("div", {});
  const basics = el("div", {className: "section"}, el("h2", {text: "Core"}));
  const grid = el("div", {className: "grid"});
  grid.append(
    field("port", numInput(data.port, {id: "c-port"})),
    field("log_level", (() => {
      const s = selectInput(data.log_level || "INFO", ["DEBUG", "INFO", "WARNING", "ERROR"]);
      s.id = "c-log";
      return s;
    })()),
    field("max_inject_depth", numInput(data.max_inject_depth, {id: "c-depth"})),
    field("log_buffer_size", numInput(data.log_buffer_size, {id: "c-buf"})),
    el("div", {className: "field wide"}, el("label", {text: "db_path"}), textInput(data.db_path, {id: "c-db"})),
    el("div", {className: "field wide"}, el("label", {text: "upload_dir"}), textInput(data.upload_dir, {id: "c-upload"})),
    field("runtime", textInput(data.runtime, {id: "c-runtime", placeholder: "docker | kubernetes | none"})),
  );
  basics.appendChild(grid);
  wrap.appendChild(basics);

  const secrets = el("div", {className: "section"}, el("h2", {text: "Tokens (optional — prefer env)"}));
  const sg = el("div", {className: "grid"});
  sg.append(
    el("div", {className: "field wide"}, el("label", {text: "auth_token"}), textInput(data.auth_token, {id: "c-auth"})),
    el("div", {className: "field wide"}, el("label", {text: "webhook_token"}), textInput(data.webhook_token, {id: "c-wh"})),
  );
  secrets.appendChild(sg);
  wrap.appendChild(secrets);

  const whSec = el("div", {className: "section"}, el("h2", {text: "webhooks (name → token)"}));
  const whBox = el("div", {className: "kv", id: "c-webhooks"});
  const wh = data.webhooks && typeof data.webhooks === "object" ? data.webhooks : {};
  const whEntries = Object.entries(wh);
  if (!whEntries.length) whBox.appendChild(el("p", {className: "empty", text: "No named webhooks"}));
  for (const [k, v] of whEntries) whBox.appendChild(kvRow(k, v));
  whSec.append(
    whBox,
    el("button", {type: "button", className: "act small", text: "+ webhook", onClick: () => {
      if (whBox.querySelector(".empty")) whBox.innerHTML = "";
      whBox.appendChild(kvRow("", ""));
    }}),
  );
  wrap.appendChild(whSec);
  return wrap;
}

function syncCoreFormToModel() {
  const next = Object.assign({}, model);
  for (const k of knownKeys) delete next[k];

  const port = document.getElementById("c-port").value;
  if (port !== "") next.port = Number(port);
  next.log_level = document.getElementById("c-log").value;
  const depth = document.getElementById("c-depth").value;
  if (depth !== "") next.max_inject_depth = Number(depth);
  const buf = document.getElementById("c-buf").value;
  if (buf !== "") next.log_buffer_size = Number(buf);
  const db = document.getElementById("c-db").value.trim();
  if (db) next.db_path = db;
  const upload = document.getElementById("c-upload").value.trim();
  if (upload) next.upload_dir = upload;
  const runtime = document.getElementById("c-runtime").value.trim();
  if (runtime) next.runtime = runtime;
  const auth = document.getElementById("c-auth").value;
  if (auth) next.auth_token = auth;
  const wh = document.getElementById("c-wh").value;
  if (wh) next.webhook_token = wh;

  const webhooks = readKv(document.getElementById("c-webhooks"));
  if (Object.keys(webhooks).length) next.webhooks = webhooks;

  model = next;
}

/* ---------- Sync ---------- */

function syncFormToModel() {
  if (model == null && kind !== "route") throw new Error("nothing to sync");
  if (kind === "handler") syncHandlerFormToModel();
  else if (kind === "route") syncRoutesFormToModel();
  else if (kind === "core") syncCoreFormToModel();
}

async function syncModelToRaw() {
  if (!current) return;
  const res = await api("/api/serialize/" + encodeURI(current), {
    method: "POST", headers: headers(),
    body: JSON.stringify({data: model}),
  });
  document.getElementById("editor").value = res.content;
}

async function syncRawToModel() {
  if (!current) return;
  const content = document.getElementById("editor").value;
  const parsed = await api("/api/parse/" + encodeURI(current), {
    method: "POST", headers: headers(),
    body: JSON.stringify({content}),
  });
  model = parsed.data;
  kind = parsed.kind;
}

async function currentContent() {
  if (mode === "form") {
    syncFormToModel();
    await syncModelToRaw();
  }
  return document.getElementById("editor").value;
}

document.getElementById("btn-validate").onclick = async () => {
  if (!current) return;
  try {
    const content = await currentContent();
    const report = await api("/api/validate/" + encodeURI(current), {
      method: "POST", headers: headers(),
      body: JSON.stringify({content}),
    });
    if (report.ok) setStatus("valid (" + report.kind + ")", "ok");
    else setStatus(report.errors.join("; "), "bad");
  } catch (e) {
    setStatus(String(e.message || e), "bad");
  }
};

document.getElementById("btn-save").onclick = async () => {
  if (!current) return;
  try {
    const content = await currentContent();
    const res = await api("/api/files/" + encodeURI(current), {
      method: "PUT", headers: headers(),
      body: JSON.stringify({content, backup: true}),
    });
    setStatus("saved · " + res.bytes + " bytes · restart core to apply", "ok");
  } catch (e) {
    setStatus(String(e.message || e), "bad");
  }
};

document.getElementById("editor").addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "s") {
    e.preventDefault();
    document.getElementById("btn-save").click();
  }
});

// ---- connectors (only when the server has a provisioner configured) ----
const connectorsEnabled = "__CONNECTORS__" === "1";
let connTimer = null;

function showView(name) {
  const conn = name === "connectors";
  document.querySelector("main").style.display = conn ? "none" : "";
  document.getElementById("connectors-view").classList.toggle("on", conn);
  document.getElementById("view-files").classList.toggle("active", !conn);
  document.getElementById("view-connectors-btn").classList.toggle("active", conn);
  clearTimeout(connTimer);
  if (conn) loadConnectors();
}

if (connectorsEnabled) {
  document.getElementById("view-tabs").classList.add("on");
  document.getElementById("view-files").onclick = () => showView("files");
  document.getElementById("view-connectors-btn").onclick = () => showView("connectors");
}

async function loadConnectors() {
  const cards = document.getElementById("cards");
  let catalog, active;
  try {
    catalog = (await api("/api/connectors/catalog", {headers: headers()})).catalog;
    active = (await api("/api/connectors", {headers: headers()})).connectors;
  } catch (e) {
    cards.innerHTML = '<p class="empty">' + esc(String(e.message || e)) + "</p>";
    return;
  }
  const byType = Object.fromEntries(active.map(c => [c.type, c]));
  // do not clobber a card the user is typing in
  const typing = cards.contains(document.activeElement) && document.activeElement.tagName === "INPUT";
  if (!typing) {
    cards.innerHTML = "";
    for (const entry of catalog) cards.appendChild(renderConnector(entry, byType[entry.type]));
  }
  if (active.some(c => c.status !== "running" || c.detail)) {
    clearTimeout(connTimer);
    connTimer = setTimeout(loadConnectors, 5000);
  }
}

function renderConnector(entry, act) {
  const card = el("div", {className: "card"});
  const title = el("h3", null, entry.label);
  if (act) title.appendChild(el("span", {className: "badge " + act.status}, act.status));
  card.appendChild(title);
  card.appendChild(el("p", {className: "desc"}, entry.description || ""));
  if (act && act.detail) {
    const problem = /BackOff|Err|Error|Invalid|OOM|Failed|CreateContainer/.test(act.detail);
    card.appendChild(el("p", {className: "detail" + (problem ? " bad" : "")}, act.detail));
  }

  const fieldsBox = el("div", {className: "fields"});
  const inputs = {};
  for (const f of entry.fields) {
    const cur = act ? act.fields[f.name] : null;
    const input = el("input", {
      type: f.secret ? "password" : "text",
      autocomplete: "off",
      placeholder: f.secret && cur && cur.set ? "set — leave empty to keep"
        : (f.default || ""),
    });
    if (!f.secret) input.value = cur && cur.value ? cur.value : (act ? "" : (f.default || ""));
    inputs[f.name] = input;
    const wrap = el("div", {className: "field"},
      el("label", null, f.label + (f.required ? " *" : "")), input);
    if (f.help) wrap.appendChild(el("span", {className: "help"}, f.help));
    fieldsBox.appendChild(wrap);
  }
  card.appendChild(fieldsBox);

  const msg = el("span", {className: "msg"});
  const save = el("button", {className: "act primary", type: "button"}, act ? "Save" : "Activate");
  save.onclick = async () => {
    const fields = {};
    for (const [name, input] of Object.entries(inputs)) fields[name] = input.value;
    save.disabled = true; msg.className = "msg"; msg.textContent = "working…";
    try {
      await api("/api/connectors/" + encodeURIComponent(entry.type), {
        method: "PUT", headers: headers(), body: JSON.stringify({fields}),
      });
      await loadConnectors();
    } catch (e) {
      msg.className = "msg bad"; msg.textContent = String(e.message || e);
      save.disabled = false;
    }
  };
  const actions = el("div", {className: "actions"}, save);
  if (act) {
    const del = el("button", {className: "act", type: "button"}, "Deactivate");
    del.onclick = async () => {
      if (!confirm("Deactivate " + entry.label + "? Its stored credentials are deleted.")) return;
      try {
        await api("/api/connectors/" + encodeURIComponent(entry.type), {
          method: "DELETE", headers: headers(),
        });
        await loadConnectors();
      } catch (e) {
        msg.className = "msg bad"; msg.textContent = String(e.message || e);
      }
    };
    actions.appendChild(del);
  }
  actions.appendChild(msg);
  card.appendChild(actions);
  return card;
}

loadList();
